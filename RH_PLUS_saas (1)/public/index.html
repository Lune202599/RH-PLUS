<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH PLUS — Console SIRH</title>
<style>
  /* Carlito (métriquement compatible Calibri) auto-hébergée — aucune dépendance
     externe, aucun envoi de données à un tiers. Licence SIL OFL 1.1 : public/fonts/OFL.txt */
  @font-face { font-family: Carlito; font-weight: 400; font-style: normal; font-display: swap;
    src: url("/fonts/carlito-regular.woff2") format("woff2"); }
  @font-face { font-family: Carlito; font-weight: 700; font-style: normal; font-display: swap;
    src: url("/fonts/carlito-bold.woff2") format("woff2"); }
  :root { --forest: #178A4C; --forest-dark: #0E5C33; --blue: #1D6FD8; --slate: #33413A; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Calibri, Carlito, 'Segoe UI', system-ui, sans-serif; background: #fff; color: var(--slate); }
  h1,h2,h3 { color: var(--forest-dark); margin: 0 0 .4rem; }
  a { color: var(--blue); }
  button { font-family: inherit; cursor: pointer; }
  .btn { border: 0; border-radius: 9999px; padding: .55rem 1.1rem; font-size: .86rem; font-weight: 700; }
  .btn-primary { background: linear-gradient(135deg,#178A4C,#22A85E); color: #fff; }
  .btn-open { background: linear-gradient(135deg,#1D6FD8,#2E82EE); color: #fff; }
  .btn-ghost { background: #fff; color: var(--slate); border: 1px solid rgba(51,65,58,.18); }
  .btn-danger { background: #fff; color: #C62A21; border: 1px solid rgba(198,42,33,.35); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  input, select, textarea { font-family: inherit; font-size: .88rem; padding: .5rem .65rem; border: 1px solid #C9D8D0; border-radius: 10px; width: 100%; background: #fff; }
  label { font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; color: #6B7C74; display: block; margin-bottom: .2rem; }
  .card { background: #fff; border: 1px solid rgba(23,138,76,.14); border-radius: 14px; padding: 1rem; box-shadow: 0 1px 2px rgba(16,44,28,.05); }
  .grid { display: grid; gap: .8rem; }
  .kpi { font-size: 1.6rem; font-weight: 700; color: var(--forest-dark); }
  .muted { color: #6B7C74; font-size: .82rem; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; }
  th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; color: #6B7C74; padding: .55rem .6rem; background: #F6FAF7; }
  td { padding: .55rem .6rem; border-top: 1px solid rgba(23,138,76,.08); }
  .badge { display: inline-block; border-radius: 9999px; padding: .15rem .6rem; font-size: .72rem; font-weight: 700; }
  .b-green { background: #E8F5EC; color: var(--forest-dark); }
  .b-blue { background: #E8F1FD; color: #0E3E7A; }
  .b-warn { background: #FEF0E6; color: #B45309; }
  .b-red { background: #FDECEA; color: #C62A21; }
  header.top { display: flex; align-items: center; gap: .8rem; padding: .7rem 1.1rem; border-bottom: 1px solid rgba(23,138,76,.14); position: sticky; top: 0; background: rgba(255,255,255,.94); backdrop-filter: blur(6px); z-index: 20; }
  .logo { width: 34px; height: 34px; border-radius: 9999px; background: linear-gradient(135deg,#178A4C,#1D6FD8); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .8rem; }
  nav.tabs { display: flex; gap: .3rem; overflow-x: auto; padding: .5rem 1.1rem; border-bottom: 1px solid rgba(23,138,76,.12); position: sticky; top: 52px; background: #fff; z-index: 10; }
  .tab { border: 0; background: transparent; padding: .45rem .8rem; border-radius: 9999px; font-size: .84rem; font-weight: 600; color: #4C5F56; white-space: nowrap; }
  .tab.active { background: #E8F5EC; color: var(--forest-dark); }
  main { padding: 1.1rem; max-width: 1150px; margin: 0 auto; }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #fff; }
  .login-box { width: 100%; max-width: 420px; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .7rem; }
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(680px, 94vw); box-shadow: 0 20px 50px rgba(12,40,24,.25); }
  dialog::backdrop { background: rgba(15,40,26,.45); }
  .dlg-body { padding: 1.1rem; }
  .note { background: #F6FAF7; border-left: 3px solid var(--forest); border-radius: 10px; padding: .6rem .8rem; font-size: .82rem; color: #3C4F46; }
  .warn { background: #FEF7EC; border-left: 3px solid #E09F1F; border-radius: 10px; padding: .6rem .8rem; font-size: .82rem; color: #7A4E05; }
  .toast { position: fixed; right: 1rem; bottom: 1rem; background: #0E5C33; color: #fff; padding: .7rem 1rem; border-radius: 12px; font-size: .85rem; max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 50; }
  .toast.err { background: #C62A21; }
  .flex-between { display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; }
  code { background: #F2F7F4; padding: .1rem .35rem; border-radius: 6px; font-size: .82rem; }
</style>
</head>
<body>
<!-- Contenu de démarrage : si le JavaScript est lent, bloqué ou en erreur, la page
     affiche un message utile au lieu d'un écran blanc. Il est remplacé au chargement. -->
<div id="app"><div class="login-wrap"><div class="login-box card">
  <div class="row" style="gap:.6rem;margin-bottom:.9rem">
    <div class="logo">RH</div>
    <div><div style="font-weight:700;color:var(--forest-dark)">RH PLUS</div>
      <div class="muted">Console SIRH — chargement en cours…</div></div>
  </div>
  <div class="note">
    <noscript><strong>JavaScript est désactivé dans ce navigateur.</strong> La console et le
    portail salarié en ont besoin : activez JavaScript, puis rechargez cette page.</noscript>
    <span id="boot-aide">Si ce message persiste, ouvrez la page directement dans un navigateur
    (adresse du serveur RH PLUS) au lieu d'un aperçu intégré.</span>
    <br>Vous êtes salarié(e) ? <a href="/portail">Ouvrir mon espace salarié</a>.
  </div>
</div></div></div>
<dialog id="dlg"><div class="dlg-body" id="dlg-body"></div></dialog>
<div id="toasts"></div>

<script>
/* ===================== Utilitaires ===================== */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, cur = 'FCFA') => Math.round(Number(n || 0)).toLocaleString('fr-FR') + ' ' + cur;
const dateFr = (d) => (d ? new Date(d).toLocaleDateString('fr-FR') : '—');
let ME = null, COMPANY = null, VIEW = 'dashboard';
// Jeton de session gardé en mémoire : permet à la console de fonctionner même quand le
// navigateur refuse le cookie (aperçu intégré, iframe, cookies tiers bloqués).
let SESSION = null;

function toast(msg, err) {
  const el = document.createElement('div');
  el.className = 'toast' + (err ? ' err' : '');
  el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => el.remove(), 5200);
}

async function api(method, url, body) {
  const headers = { 'content-type': 'application/json' };
  if (SESSION) headers.authorization = 'Bearer ' + SESSION;
  const res = await fetch(url, {
    method,
    headers,
    body: body ? (body instanceof Blob ? body : JSON.stringify(body)) : undefined,
    credentials: 'same-origin',
  });
  const type = res.headers.get('content-type') || '';
  if (type.includes('application/json')) {
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur serveur');
    return data;
  }
  if (!res.ok) throw new Error('Erreur ' + res.status);
  return res.blob();
}
async function download(url, filename) {
  const blob = await api('GET', url);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
function openDialog(html) { $('#dlg-body').innerHTML = html; $('#dlg').showModal(); }
function closeDialog() { $('#dlg').close(); }
const ICON = {
  dash: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7"/></svg>',
  team: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.3 3-5 6.5-5s6.5 1.7 6.5 5"/><circle cx="17.5" cy="9" r="2.5"/></svg>',
  leave: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  pay: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10"/></svg>',
  vault: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  bill: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
  shield: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 6v6c0 4.4 3.4 8.2 8 9.5 4.6-1.3 8-5.1 8-9.5V6z"/></svg>',
  log: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v14H4z"/><path d="M8 9h8M8 13h5"/></svg>',
  key: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M17 6l2 2M15 8l2 2"/></svg>',
  globe: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>',
  send: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12 21 4l-7 17-3-7z"/></svg>',
};
const TABS = [
  ['dashboard', 'Tableau de bord', ICON.dash], ['employees', 'Employés', ICON.team], ['leaves', 'Congés', ICON.leave],
  ['payroll', 'Paie', ICON.pay], ['documents', 'Coffre-fort', ICON.vault], ['billing', 'Abonnement', ICON.bill],
  ['compliance', 'Conformité', ICON.shield], ['users', 'Comptes & accès', ICON.key], ['audit', 'Journal', ICON.log],
];
// Le compte plateforme (éditeur) ne voit pas les dossiers des salariés : il administre les entreprises clientes.
const TABS_PLATEFORME = [['platform', 'Plateforme', ICON.globe], ['audit', 'Journal', ICON.log]];
const ongletsPour = (role) => (role === 'platform_admin' ? TABS_PLATEFORME : TABS);

/* ===================== Connexion ===================== */
function renderLogin(step, ctx) {
  $('#app').innerHTML = `
    <div class="login-wrap"><div class="login-box card">
      <div class="row" style="gap:.6rem;margin-bottom:.9rem">
        <div class="logo">RH</div>
        <div><div style="font-weight:700;color:var(--forest-dark)">RH PLUS</div><div class="muted">Console SIRH — connexion sécurisée</div></div>
      </div>
      <div id="login-step1" style="display:${step === 2 ? 'none' : 'block'}">
        <h3 style="font-size:1.05rem">Connexion</h3>
        <div class="grid" style="margin-top:.6rem">
          <div><label>Email professionnel</label><input id="lg-email" type="email" autocomplete="username" value="${esc(ctx && ctx.email || 'admin@rhplus.ga')}"></div>
          <div><label>Mot de passe</label><input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
          <button class="btn btn-primary" id="lg-go">Se connecter</button>
          <div class="note">Démonstration : <code>admin@rhplus.ga</code> · mot de passe <code>RhPlus!2026</code> (le code de vérification s'affiche à l'écran hors production).
            <br>Vous êtes salarié(e) ? <a href="/portail">Ouvrir mon espace salarié</a>.</div>
        </div>
      </div>
      <div id="login-step2" style="display:${step === 2 ? 'block' : 'none'}">
        <h3 style="font-size:1.05rem">Vérification en deux étapes</h3>
        <p class="muted">Un code à 6 chiffres a été envoyé (SMS / email) au titulaire du compte.</p>
        <div class="grid" style="margin-top:.6rem">
          <div><label>Code de vérification</label><input id="lg-code" inputmode="numeric" maxlength="6" placeholder="123456"></div>
          <button class="btn btn-primary" id="lg-verify">Valider le code</button>
          <button class="btn btn-ghost" id="lg-back">Revenir</button>
          ${ctx && ctx.dev ? `<div class="warn">Mode démonstration — code affiché : <strong>${esc(ctx.dev)}</strong></div>` : ''}
        </div>
      </div>
    </div></div>`;

  const email = () => $('#lg-email') ? $('#lg-email').value.trim() : (ctx && ctx.email);
  if ($('#lg-go')) $('#lg-go').onclick = async () => {
    try {
      const r = await api('POST', '/api/auth/login', { email: email(), password: $('#lg-pass').value });
      if (r.step === '2fa') renderLogin(2, { email: email(), dev: r.dev_code });
      else await afterLogin();
    } catch (e) { toast(e.message, true); }
  };
  if ($('#lg-verify')) $('#lg-verify').onclick = async () => {
    try {
      const r = await api('POST', '/api/auth/verify', { email: email(), code: $('#lg-code').value.trim() });
      if (r && r.token) SESSION = r.token;
      await afterLogin();
    }
    catch (e) { toast(e.message, true); }
  };
  if ($('#lg-back')) $('#lg-back').onclick = () => renderLogin(1, { email: email() });
  if ($('#lg-pass')) $('#lg-pass').onkeydown = (e) => { if (e.key === 'Enter') $('#lg-go').click(); };
}

async function afterLogin() {
  const me = await api('GET', '/api/auth/me');
  ME = me.user; COMPANY = me.company;
  toast('Bienvenue ' + ME.name + ' — ' + COMPANY.name);
  renderShell();
}

/* ===================== Coquille ===================== */
function renderShell() {
  $('#app').innerHTML = `
    <header class="top">
      <div class="logo">RH</div>
      <div style="line-height:1.15">
        <div style="font-weight:700;color:var(--forest-dark)">RH PLUS</div>
        <div class="muted">${esc(COMPANY.name)} · ${esc(COMPANY.country)} · ${esc(COMPANY.currency)}</div>
      </div>
      <div class="row" style="margin-left:auto">
        <span class="badge b-blue">${esc(ME.role)}</span>
        <span class="muted">${esc(ME.email)}</span>
        <button class="btn btn-ghost" id="logout">Déconnexion</button>
      </div>
    </header>
    <nav class="tabs">${ongletsPour(ME.role).map(([k, l, i]) => `<button class="tab" data-tab="${k}">${i} ${l}</button>`).join('')}</nav>
    <main id="view"></main>`;
  $('#logout').onclick = async () => { await api('POST', '/api/auth/logout'); SESSION = null; ME = null; renderLogin(1); };
  document.querySelectorAll('.tab').forEach((b) => b.onclick = () => show(b.dataset.tab));
  show(ME.role === 'platform_admin' ? 'platform' : 'dashboard');
}

function highlight(tab) {
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === tab));
}
async function show(tab) {
  VIEW = tab; highlight(tab);
  const box = $('#view');
  box.innerHTML = '<div class="card muted">Chargement…</div>';
  try {
    if (tab === 'dashboard') return renderDashboard(box);
    if (tab === 'employees') return renderEmployees(box);
    if (tab === 'leaves') return renderLeaves(box);
    if (tab === 'payroll') return renderPayroll(box);
    if (tab === 'documents') return renderDocuments(box);
    if (tab === 'billing') return renderBilling(box);
    if (tab === 'compliance') return renderCompliance(box);
    if (tab === 'users') return renderUsers(box);
    if (tab === 'audit') return renderAudit(box);
    if (tab === 'platform') return renderPlatform(box);
  } catch (e) { box.innerHTML = `<div class="card"><strong>Erreur :</strong> ${esc(e.message)}</div>`; }
}
const refresh = () => show(VIEW);

/* ===================== Plateforme (éditeur RH PLUS) ===================== */
const PAYS = ['Gabon', 'Sénégal', 'Cameroun', "Côte d'Ivoire", 'France', 'Maroc'];
async function renderPlatform(box) {
  const d = await api('GET', '/api/platform/overview');
  const t = d.totaux;
  const val = await api('GET', '/api/platform/validations');
  const msg = await api('GET', '/api/platform/messages');
  const canal = (c) => c && c.configured
    ? `<span class="badge b-green">${esc(c.mode)}</span>`
    : `<span class="badge b-warn">non configuré</span>`;
  box.innerHTML = `
    <div class="flex-between"><h2>Entreprises clientes</h2>
      <span class="muted">Éditeur : ${esc(d.editeur.name)} · ${d.entreprises.length} entreprise(s) cliente(s)</span></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(155px,1fr));margin:.8rem 0 1rem">
      ${kpiCard('Entreprises', t.entreprises, t.actives + ' active(s), ' + t.suspendues + ' suspendue(s)')}
      ${kpiCard('Abonnement mensuel', money(t.mrr, 'FCFA'), 'revenu récurrent')}
      ${kpiCard('Salariés gérés', t.effectif, 'toutes entreprises')}
      ${kpiCard('Comptes ouverts', t.comptes, 'utilisateurs')}
      ${kpiCard('À mettre en conformité', t.a_mettre_en_conformite, 'barème ou APDPVP')}
      ${kpiCard('Factures impayées', t.impayees, 'toutes entreprises')}
    </div>

    <div class="card">
      <div class="flex-between"><h3 style="font-size:1rem">Portefeuille</h3>
        <button class="btn btn-open" id="p-new">Créer une entreprise</button></div>
      <table><thead><tr><th>Entreprise</th><th>Pays</th><th>Offre</th><th>Effectif</th><th>Abonnement</th><th>Barème de paie</th><th>APDPVP</th><th></th></tr></thead><tbody>
      ${d.entreprises.map((e) => `<tr>
        <td><strong>${esc(e.name)}</strong><div class="muted">${esc(e.city || '—')} · cliente depuis le ${dateFr(e.created_at)}</div></td>
        <td>${esc(e.country)}<div class="muted">${esc(e.currency)}</div></td>
        <td>${esc(e.plan)}${e.usage.depassement ? '<div class="muted">hors plafond</div>' : ''}</td>
        <td>${e.usage.effectif}<div class="muted">${e.usage.comptes} compte(s)</div></td>
        <td>${e.suspended ? '<span class="badge b-red">accès suspendu</span>' : money(e.usage.mrr, 'FCFA') + '<div class="muted">par mois</div>'}</td>
        <td>${e.conformite.baremes.a_jour
          ? `<span class="badge b-green">${esc(e.conformite.baremes.version)} validé</span><div class="muted">jusqu'au ${dateFr(e.conformite.baremes.expire_le)}</div>`
          : '<span class="badge b-warn">à valider</span>'}</td>
        <td>${e.conformite.apdpvp.a_jour ? '<span class="badge b-green">déclaré</span>' : '<span class="badge b-warn">non déclaré</span>'}
          <div class="muted">${esc(e.conformite.hosting || 'hébergement à préciser')}</div></td>
        <td class="row"><button class="btn btn-ghost" data-fiche="${e.id}">Détail</button>
          <button class="btn ${e.suspended ? 'btn-open' : 'btn-danger'}" data-susp="${e.id}" data-etat="${e.suspended ? 0 : 1}">${e.suspended ? 'Réactiver' : 'Suspendre'}</button></td></tr>`).join('')}
      </tbody></table>
    </div>

    <div class="grid" style="grid-template-columns:1.25fr 1fr;margin-top:1rem">
      <div class="card">
        <h3 style="font-size:1rem">Barèmes de paie &amp; validations</h3>
        <div class="muted">Une validation d'expert-comptable vaut 12 mois. Tant qu'elle manque, les bulletins de l'entreprise restent en brouillon et ne peuvent pas être émis.</div>
        <table style="margin-top:.6rem"><thead><tr><th>Pays</th><th>Version</th><th>État</th><th>Cabinet</th><th></th></tr></thead><tbody>
        ${d.entreprises.length === 0 ? '' : ''}
        ${val.pays.map((p) => {
          const v = val.validations.find((x) => x.country === p.country && x.active);
          return `<tr><td>${esc(p.country)}</td><td><code>${esc(p.version)}</code></td>
            <td>${v ? `<span class="badge b-green">validé</span><div class="muted">jusqu'au ${dateFr(v.expires_at)}</div>` : '<span class="badge b-warn">non validé</span>'}</td>
            <td>${esc(v ? v.cabinet : '—')}${v && v.order_ref ? `<div class="muted">réf. ${esc(v.order_ref)}</div>` : ''}</td>
            <td class="row"><button class="btn btn-ghost" data-note="${esc(p.country)}">Note à signer</button>
              <button class="btn btn-open" data-valider="${esc(p.country)}" data-version="${esc(p.version)}">Enregistrer</button></td></tr>`;
        }).join('')}
        </tbody></table>
      </div>

      <div class="card">
        <h3 style="font-size:1rem">Envois de notifications</h3>
        <div class="muted">Email : ${canal(msg.etat.email)} · SMS : ${canal(msg.etat.sms)}
          ${msg.etat.pret_pour_la_production ? '' : '<div class="warn" style="margin-top:.4rem">Mode console : les codes de connexion s’affichent à l’écran au lieu d’être envoyés. Renseignez RHPLUS_MAIL et RHPLUS_SMS pour passer en envoi réel.</div>'}</div>
        <div class="grid" style="margin-top:.6rem">
          <div class="row" style="gap:.5rem;flex-wrap:wrap">
            <input id="m-mail" placeholder="email de test" style="flex:1;min-width:150px">
            <input id="m-tel" placeholder="+241 06 00 00 00" style="flex:1;min-width:130px">
            <button class="btn btn-open" id="m-test">Tester</button>
          </div>
        </div>

          closeDialog(); toast('Conformité mise à jour'); refresh();
        } catch (e) { toast(e.message, true); }
      };

  });

async function renderDocuments(box) {
  const { employees } = await api('GET', '/api/employees');
  const { documents } = await api('GET', '/api/documents');
  const nameOf = (id) => (employees.find((e) => e.id === id) || {}).name || 'Entreprise';

  box.innerHTML = `
    <div class="flex-between"><h2>Coffre-fort numérique</h2>
      ${canUp ? '<button class="btn btn-primary" id="up-doc">Archiver un document</button>' : ''}</div>
    <div class="note" style="margin-top:.6rem">Chaque document est chiffré en base (AES-256-GCM), son empreinte SHA-256 est enregistrée et chaque consultation est journalisée.</div>
    <div class="card" style="margin-top:.8rem;overflow:auto">
      <table><thead><tr><th>Document</th><th>Dossier</th><th>Salarié</th><th>Taille</th><th>Empreinte</th><th>Déposé le</th><th></th></tr></thead>
      <tbody>${documents.map((d) => `<tr><td>${esc(d.name)}</td><td>${esc(d.folder)}</td><td>${esc(d.employee_id ? nameOf(d.employee_id) : 'Entreprise')}</td>
        <td>${(d.size / 1024).toFixed(1)} Ko</td><td><code>${esc(String(d.sha256).slice(0, 12))}…</code></td><td>${dateFr(d.created_at)}</td>
        <td class="row"><button class="btn btn-ghost" data-dl="${d.id}">Télécharger</button>
        ${ME.role === 'admin' ? `<button class="btn btn-danger" data-del="${d.id}">Détruire</button>` : ''}</td></tr>`).join('')}
      </tbody></table>
      ${documents.length ? '' : '<div class="note">Aucun document archivé.</div>'}
    </div>`;
  box.querySelectorAll('[data-dl]').forEach((b) => b.onclick = () => {
    const d = documents.find((x) => x.id === Number(b.dataset.dl));
    download(`/api/documents/${d.id}/download`, d.name).catch((e) => toast(e.message, true));
  });
  box.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    if (!confirm('Détruire définitivement ce document ?')) return;
    await api('DELETE', `/api/documents/${b.dataset.del}`); toast('Document détruit — action journalisée'); refresh();
  });
  if ($('#up-doc')) $('#up-doc').onclick = () => {
    openDialog(`<h3>Archiver un document</h3>
      <form id="f-doc" class="grid" style="margin-top:.6rem">
        <div class="cols">
          <div><label>Salarié</label><select name="employee_id">${employees.map((e) => `<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></div>
          <div><label>Dossier</label><select name="folder"><option>contrat</option><option>paie</option><option>attest</option><option>medical</option><option>perso</option></select></div>
        </div>
        <div><label>Fichier (8 Mo max)</label><input name="file" type="file" required></div>
        <div class="row" style="justify-content:flex-end"><button type="button" class="btn btn-ghost" id="f-cancel">Annuler</button><button class="btn btn-primary">Chiffrer &amp; archiver</button></div>
      </form>`);
    $('#f-cancel').onclick = closeDialog;
    $('#f-doc').onsubmit = async (ev) => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      const file = fd.get('file');
      const buf = await file.arrayBuffer();
      const b64 = btoa(String.fromCharCode(...new Uint8Array(buf)));
      try {
        await api('POST', '/api/documents', { employee_id: Number(fd.get('employee_id')), folder: fd.get('folder'), name: file.name, mime: file.type || 'application/octet-stream', content_base64: b64 });
        closeDialog(); toast('Document chiffré et archivé'); refresh();
      } catch (e) { toast(e.message, true); }
    };
  };
}

  const propose = motDePasseProvisoire();
  openDialog(`
    <h3>Nouveau compte</h3>
    <div class="muted">Un rôle « employé » ouvre l'espace salarié et doit être rattaché à un dossier (accès limité à ce dossier).
      Les rôles « manager », « rh » et « admin » utilisent la console RH PLUS.</div>
    <form id="f-user" class="grid" style="margin-top:.8rem">
      <div><label>Dossier salarié</label>
        <select name="employee_id">
          <option value="">— aucun (personnel RH) —</option>
          ${d.sans_compte.map((e) => `<option value="${e.id}">${esc(e.matricule)} · ${esc(e.name)}</option>`).join('')}
        </select></div>
      <div class="cols">
        <div><label>Nom affiché</label><input name="name" placeholder="Prénom Nom"></div>
        <div><label>Rôle</label><select name="role">
          <option value="employee">employé (portail salarié)</option>
          <option value="manager">manager</option><option value="rh">rh</option><option value="admin">admin</option>
        </select></div>
      </div>
      <div><label>Email professionnel</label><input name="email" type="email" required placeholder="prenom.nom@entreprise.ga"></div>
      <div><label>Mot de passe provisoire (8 caractères minimum)</label><input name="password" value="${esc(propose)}" required></div>
      <div class="note">Communiquez ce mot de passe au salarié : il peut le changer à la première connexion.
        L'accès est protégé par une vérification en deux étapes.</div>
      <div class="row" style="justify-content:flex-end">
        <button type="button" class="btn btn-ghost" id="f-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Créer le compte</button>
      </div>
    </form>`);
  $('#f-cancel').onclick = closeDialog;
  $('#f-user').onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const b = Object.fromEntries(new FormData(ev.target).entries());
      if (!b.employee_id) delete b.employee_id;
      const r = await api('POST', '/api/users', b);
      closeDialog();
      toast('Compte créé — ' + r.email);
      refresh();
    } catch (e) { toast(e.message, true); }
  };
}

function openResetUser(id, email) {
  openDialog(`
    <h3>Réinitialiser l'accès</h3>
    <div class="muted">${esc(email)}</div>
    <form id="f-reset" class="grid" style="margin-top:.8rem">
      <div><label>Nouveau mot de passe provisoire</label><input name="password" value="${esc(motDePasseProvisoire())}" required></div>
      <label style="display:flex;gap:.5rem;align-items:center;text-transform:none;font-size:.84rem;color:var(--slate)">
        <input type="checkbox" name="revoke_sessions" checked style="width:auto"> Fermer immédiatement les sessions ouvertes
      </label>
      <div class="row" style="justify-content:flex-end">
        <button type="button" class="btn btn-ghost" id="f-cancel">Annuler</button>
        <button type="submit" class="btn btn-primary">Appliquer</button>
      </div>
    </form>`);
  $('#f-cancel').onclick = closeDialog;
  $('#f-reset').onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      const b = Object.fromEntries(new FormData(ev.target).entries());
      await api('PATCH', '/api/users/' + id, { password: b.password, revoke_sessions: !!b.revoke_sessions });
      closeDialog();
      toast('Accès réinitialisé — communiquez le nouveau mot de passe');
      refresh();
    } catch (e) { toast(e.message, true); }
  };
}

/* ===================== Journal ===================== */
async function renderAudit(box) {
  const { entries } = await api('GET', '/api/audit');
  box.innerHTML = `<h2>Journal d'activité</h2>
    <div class="muted">Traçabilité horodatée de toutes les actions sensibles — conservée 12 mois.</div>
    <div class="card" style="margin-top:.8rem;overflow:auto"><table><thead><tr><th>Date</th><th>Acteur</th><th>Rôle</th><th>Action</th><th>Détails</th><th>IP</th></tr></thead>
    <tbody>${entries.map((e) => `<tr><td>${new Date(e.at).toLocaleString('fr-FR')}</td><td>${esc(e.actor || '—')}</td><td>${esc(e.role || '—')}</td>
      <td>${esc(e.action)}</td><td class="muted">${esc(e.details || '')}</td><td class="muted">${esc(e.ip || '—')}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ===================== Démarrage ===================== */
(async function boot() {
  try {
    const me = await api('GET', '/api/auth/me');
    ME = me.user; COMPANY = me.company; renderShell();
  } catch { renderLogin(1); }
})();
</script>
